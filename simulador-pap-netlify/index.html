<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Entrevista Psicológica · Primer acercamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16332F;
    --bg-panel-shadow: rgba(10,30,27,.18);
    --panel: #FCF9F0;
    --panel-raised: #FFFFFF;
    --ink: #16211F;
    --ink-soft: #445350;
    --line: #DED6C2;
    --teal: #2F9E93;
    --teal-deep: #0F5C55;
    --brick: #C24A3B;
    --brick-soft: #F7DCD6;
    --sage: #6FA867;
    --sage-soft: #E3F0DF;
    --amber: #CE9A2C;
    --amber-soft: #F8ECCF;
    --muted: #7C8985;
    --header-fg: #F3EFE1;
    --header-fg-soft: #BFD3CE;
    --radius: 4px;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image: radial-gradient(circle at 15% 0%, #1C3F3A 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15.5px;
    line-height:1.55;
    min-height:100vh;
  }
  .app{max-width:940px;margin:0 auto;padding:28px 20px 80px;}

  .casefile-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--header-fg-soft);
    padding-bottom:12px; margin-bottom:16px;
  }
  .casefile-title{
    font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--header-fg-soft);
  }
  .casefile-title strong{color:var(--header-fg); font-weight:600;}
  .tabbar{display:flex; gap:2px;}
  .tab{
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    padding:8px 16px; cursor:pointer; border:1px solid var(--header-fg-soft); border-bottom:none;
    background:transparent; color:var(--header-fg-soft);
  }
  .tab.active{background:var(--header-fg); color:var(--teal-deep); border-color:var(--header-fg);}

  .case-banner{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, var(--teal-deep), #0B403B);
    color:var(--header-fg); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:18px;
    box-shadow:0 4px 14px var(--bg-panel-shadow);
  }
  .case-banner .case-icon{width:40px; height:40px; flex-shrink:0; color:var(--header-fg);}
  .case-banner .case-icon svg{width:100%; height:100%;}
  .case-banner .case-banner-tag{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:#9FD9CF; display:block; margin-bottom:2px;
  }
  .case-banner .case-banner-title{font-family:var(--serif); font-size:17px; font-weight:600;}
  .case-banner .case-banner-desc{font-family:var(--sans); font-size:12.5px; color:var(--header-fg-soft); margin-top:2px;}

  .phase-track{
    display:flex; align-items:center; gap:0; margin:22px 0 26px;
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em;
  }
  .phase-step{display:flex; align-items:center; gap:8px; color:var(--muted); flex:1;}
  .phase-dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--muted); flex-shrink:0;}
  .phase-step.done .phase-dot{background:var(--teal); border-color:var(--teal);}
  .phase-step.current{color:var(--ink);}
  .phase-step.current .phase-dot{background:var(--brick); border-color:var(--brick);}
  .phase-line{flex:1; height:1px; background:var(--line); margin:0 6px;}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px 30px; margin-bottom:18px;
    box-shadow:0 6px 20px var(--bg-panel-shadow);
  }
  .scene-label{
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal-deep); margin-bottom:10px; display:block; font-weight:600;
  }
  .narrative{
    font-family:var(--serif); font-size:18.5px; color:var(--ink); line-height:1.68;
    margin-bottom:0;
  }
  .character-line{
    font-family:var(--serif); font-style:italic; font-size:19px; color:var(--teal-deep);
    background:var(--sage-soft); border-left:4px solid var(--sage);
    padding:14px 18px; margin-top:16px; border-radius:0 var(--radius) var(--radius) 0;
  }
  .prompt-q{
    font-family:var(--sans); font-weight:700; font-size:15.5px; color:var(--ink);
    margin:20px 0 12px;
  }

  .options{display:flex; flex-direction:column; gap:10px;}
  .option-btn{
    text-align:left; background:var(--panel-raised); border:1.5px solid var(--line);
    border-radius:var(--radius); padding:14px 18px 14px 46px; position:relative;
    font-family:var(--sans); font-size:15.5px; color:var(--ink); cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .option-btn:hover{border-color:var(--teal); background:#F1F8F7; transform:translateX(1px);}
  .option-btn:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
  .option-letter{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    font-family:var(--mono); font-size:12px; color:var(--teal-deep); font-weight:700;
  }

  textarea.freeform{
    width:100%; min-height:110px; font-family:var(--sans); font-size:14.5px;
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;
    resize:vertical; background:var(--panel-raised); color:var(--ink);
  }
  textarea.freeform:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
  .submit-row{display:flex; justify-content:flex-end; margin-top:10px;}
  .btn-primary{
    font-family:var(--sans); font-weight:600; font-size:13.5px; letter-spacing:.02em;
    background:var(--teal-deep); color:#fff; border:none; border-radius:var(--radius);
    padding:11px 20px; cursor:pointer;
  }
  .btn-primary:hover{background:var(--teal);}
  .btn-primary:disabled{background:var(--muted); cursor:not-allowed;}
  .btn-secondary{
    font-family:var(--sans); font-weight:600; font-size:13.5px;
    background:transparent; color:var(--teal-deep); border:1px solid var(--teal-deep);
    border-radius:var(--radius); padding:10px 18px; cursor:pointer;
  }

  .loading-line{
    font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:10px;
  }

  .intro-block{max-width:640px;}
  .intro-block h1{font-family:var(--serif); font-size:30px; font-weight:600; margin:8px 0 4px;}
  .intro-block .sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:22px;}
  .field-label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); display:block; margin-bottom:6px;}
  input.name-input{
    width:100%; font-family:var(--sans); font-size:15px; padding:11px 14px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-raised); margin-bottom:18px;
  }
  input.name-input:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
  .disclaimer{
    font-family:var(--sans); font-size:12.5px; color:var(--ink-soft); background:var(--amber-soft);
    border-left:3px solid var(--amber); padding:12px 16px; margin-top:20px; border-radius:0 var(--radius) var(--radius) 0;
  }

  .case-picker{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .case-option{
    display:flex; align-items:flex-start; gap:12px; padding:14px 16px;
    border:1.5px solid var(--line); border-radius:var(--radius); background:var(--panel-raised); cursor:pointer;
  }
  .case-option.selected{border-color:var(--teal); background:#F1F8F7;}
  .case-option input{margin-top:4px;}
  .case-option .case-icon{width:30px; height:30px; flex-shrink:0; color:var(--teal-deep); margin-top:1px;}
  .case-option .case-icon svg{width:100%; height:100%;}
  .case-option .case-title{font-weight:700; font-size:15px;}
  .case-option .case-desc{font-size:13px; color:var(--ink-soft); margin-top:2px;}

  .teacher-subtabs{display:flex; gap:8px; margin:16px 0 20px;}
  .teacher-subtab{
    font-family:var(--sans); font-weight:600; font-size:13px; padding:8px 16px;
    border:1.5px solid var(--line); border-radius:var(--radius); cursor:pointer;
    background:var(--panel-raised); color:var(--ink-soft);
  }
  .teacher-subtab.active{background:var(--teal-deep); color:#fff; border-color:var(--teal-deep);}

  .case-admin-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    background:var(--panel-raised); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:10px;
  }
  .case-admin-row.is-hidden{opacity:.55;}
  .case-admin-row .case-admin-title{font-weight:700; font-size:14.5px;}
  .case-admin-row .case-admin-desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .case-admin-actions{display:flex; gap:8px; flex-shrink:0;}
  .btn-mini{
    font-family:var(--sans); font-weight:600; font-size:12px; padding:7px 12px;
    border-radius:var(--radius); cursor:pointer; border:1.5px solid var(--teal-deep);
    background:transparent; color:var(--teal-deep);
  }
  .btn-mini.danger{border-color:var(--brick); color:var(--brick);}
  .btn-mini.warn{border-color:var(--amber); color:#7A5C1E;}

  .case-form{margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}
  .case-form .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-bottom:14px;}
  .case-form label{display:block; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:4px;}
  .case-form input, .case-form textarea{
    width:100%; font-family:var(--sans); font-size:13.5px; padding:9px 11px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-raised); color:var(--ink);
  }
  .case-form textarea{min-height:64px; resize:vertical;}
  .case-form .full{grid-column:1 / -1;}
  .case-form-actions{display:flex; gap:10px; margin-top:8px;}
  .image-upload-row{display:flex; gap:16px; align-items:center; margin-bottom:6px;}
  .image-preview{
    width:130px; height:88px; border:1.5px dashed var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:var(--panel-raised); font-size:11px; color:var(--muted); flex-shrink:0; text-align:center;
  }
  .image-preview img{width:100%; height:100%; object-fit:cover;}
  .image-upload-controls{display:flex; flex-direction:column; gap:8px;}
  .image-upload-controls input[type="file"]{font-size:12.5px;}
  .case-admin-thumb{
    width:44px; height:44px; border-radius:var(--radius); overflow:hidden; flex-shrink:0;
    background:var(--sage-soft); display:flex; align-items:center; justify-content:center; color:var(--teal-deep);
  }
  .case-admin-thumb img{width:100%; height:100%; object-fit:cover;}
  .case-admin-thumb svg{width:24px; height:24px;}

  .score-hero{display:flex; align-items:center; gap:26px; margin-bottom:24px;}
  .score-circle{
    width:118px; height:118px; border-radius:50%; border:6px solid var(--teal);
    display:flex; align-items:center; justify-content:center; flex-direction:column; flex-shrink:0;
    font-family:var(--mono);
  }
  .score-circle .num{font-size:30px; font-weight:600; color:var(--ink);}
  .score-circle .den{font-size:10px; color:var(--muted);}
  .level-tag{
    display:inline-block; font-family:var(--mono); font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; padding:4px 10px; border-radius:2px; margin-bottom:6px;
  }
  .level-excelente{background:var(--sage-soft); color:#3E5C3A;}
  .level-adecuado{background:#DCEAE8; color:var(--teal-deep);}
  .level-desarrollo{background:var(--amber-soft); color:#7A5C1E;}
  .level-fortalecimiento{background:var(--brick-soft); color:#7A2E25;}

  .bar-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .bar-label{font-family:var(--sans); font-size:13px; width:230px; flex-shrink:0; color:var(--ink-soft);}
  .bar-track{flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--teal); border-radius:4px;}
  .bar-val{font-family:var(--mono); font-size:12px; width:52px; text-align:right; color:var(--ink-soft);}

  .report-section h3{
    font-family:var(--sans); font-size:13px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-soft); margin:26px 0 10px; border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  .report-section ul{margin:0; padding-left:20px;}
  .report-section li{font-size:14px; margin-bottom:6px;}
  .tag-strength{color:#3E5C3A;}
  .tag-error{color:#7A2E25;}
  .tag-risk{color:#7A2E25; font-weight:600;}

  .session-row{
    background:var(--panel-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:10px; cursor:pointer;
  }
  .session-row-head{display:flex; justify-content:space-between; align-items:center; font-family:var(--sans); font-size:14px; flex-wrap:wrap; gap:6px;}
  .session-row-head .name{font-weight:600;}
  .session-row-head .meta{font-family:var(--mono); font-size:11.5px; color:var(--muted);}
  .session-detail{margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:none;}
  .session-detail.open{display:block;}
  .log-entry{font-size:13px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--line);}
  .log-entry .scene-tag{font-family:var(--mono); font-size:10.5px; color:var(--teal-deep); text-transform:uppercase;}
  .empty-note{font-family:var(--mono); font-size:12.5px; color:var(--muted); padding:20px 0;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){

/* ============================================================
   BANCO DE CASOS (PACIENTES/CONSULTANTES)
   Cada caso define un consultante distinto (motivo de consulta,
   contexto) y se combina con una plantilla común de escenas que
   recorre una primera entrevista clínica: encuadre, apertura,
   exploración del motivo de consulta e historia, exploración de
   riesgo, contexto de apoyo, y cierre. Esto permite que el
   simulador presente un caso distinto en cada inicio o reinicio,
   evitando que el estudiante memorice un único guion.
   ============================================================ */

/* Íconos SVG en línea (no dependen de imágenes externas ni de internet)
   usados en el selector de casos y en el banner permanente durante la
   simulación, para ayudar a identificar visualmente cada caso. */
const CASE_ICONS = {
  ansiedad_academica: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 9h8M8 13h5"/><path d="M14 19v-4a1 1 0 0 1 1-1h2"/></svg>`,
  animo_bajo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 15.5c1-1.2 2.2-1.8 3.5-1.8s2.5.6 3.5 1.8"/><path d="M9 10h.01M15 10h.01"/></svg>`,
  consulta_familiar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="16" cy="8" r="2"/><path d="M2.5 20c0-3.3 2.6-5.5 6-5.5s6 2.2 6 5.5"/><path d="M14.3 15c2.5.4 3.7 2.2 3.7 5"/></svg>`,
  generico: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/><path d="M19 3l1.3 1.3M20.3 3L19 4.3"/></svg>`
};
function caseIcon(id){ return CASE_ICONS[id] || CASE_ICONS.generico; }

const CASES = [
  {
    id: "ansiedad_academica",
    tag: "Caso A",
    tituloCorto: "Ansiedad y bajo rendimiento académico",
    descripcion: "Camila, 21 años, estudiante universitaria, consulta por iniciativa propia luego de varias semanas con dificultad para dormir y ataques de pánico antes de los exámenes.",
    nombre: "Camila", edad: 21,
    persona: "la consultante", personaCap: "La consultante", pron: "ella",
    acompanado: "por iniciativa propia", herido: "",
    llegada: "Revisas la ficha de derivación antes de recibir a la consultante: llega por iniciativa propia, refiere \"ansiedad\" y \"problemas para dormir\" hace unas seis semanas. Es tu primera vez viéndola. La sala de entrevista está lista, con privacidad asegurada. Camila llega puntual, se sienta con los brazos cruzados y mira el suelo con frecuencia mientras esperas a comenzar.",
    aperturaLine: "\"La verdad no sé muy bien por dónde empezar... llevo semanas sin dormir bien y últimamente me dan como ataques de pánico antes de los parciales.\"",
    estadoInicial: "con una postura tensa, hablando en voz baja y evitando el contacto visual sostenido",
    necesidadesNarrative: "Camila ha empezado a describir su malestar en términos generales (\"ansiedad\", \"no puedo dormir\", \"pánico\"), pero aún no has explorado con ella desde cuándo exactamente comenzó, qué tan seguido ocurre, qué lo desencadena, y cómo está afectando su día a día.",
    senalRiesgoLine: "\"A veces, cuando estoy así de agotada, pienso que sería un alivio simplemente no tener que seguir con todo esto... no es que quiera hacer algo, pero la idea aparece.\"",
    riesgoExploradoNarrative: "Camila aclara, al preguntarle directamente, que no tiene un plan ni intención de hacerse daño, y que nunca ha intentado algo así antes. Dice que la idea aparece como una forma de \"desconexión\" cuando está muy agotada, más que como un deseo real de morir. No identifica factores protectores de forma espontánea; habría que explorarlos.",
    riesgoOmitidoNarrative: "La entrevista continúa. Camila no vuelve a mencionar espontáneamente lo que dijo, y esa señal queda sin explorar por el momento."
  },
  {
    id: "animo_bajo",
    tag: "Caso B",
    tituloCorto: "Ánimo bajo tras el fin de una relación",
    descripcion: "Andrés, 24 años, fue remitido por su médico general tras consultar por fatiga persistente; en la anamnesis médica reportó tristeza sostenida desde hace dos meses, tras terminar una relación de varios años.",
    nombre: "Andrés", edad: 24,
    persona: "el consultante", personaCap: "El consultante", pron: "él",
    acompanado: "remitido por su médico general", herido: "",
    llegada: "Revisas la ficha de derivación: Andrés fue remitido por su médico general, quien descartó causas físicas para su fatiga persistente y sugirió evaluación psicológica al detectar ánimo bajo sostenido. Es la primera vez que consulta a un psicólogo. Entra a la sala con paso lento, se sienta y suspira antes de que alcances a preguntarle nada.",
    aperturaLine: "\"Honestamente no sé si esto vaya a servir de mucho, pero mi médico insistió... hace como dos meses terminé una relación larga y desde entonces no me siento yo mismo.\"",
    estadoInicial: "con un tono de voz apagado, movimientos lentos y expresión facial poco variable",
    necesidadesNarrative: "Andrés ha mencionado el quiebre de su relación como el punto de partida, pero aún no has explorado con él cómo ha afectado esto su sueño, apetito, energía, interés en actividades que antes disfrutaba, ni si esta es la primera vez que atraviesa un episodio así.",
    senalRiesgoLine: "\"Hay días en que pienso que si simplemente no despertara al otro día, tampoco sería tan grave... no es que esté planeando nada, pero la idea ha estado ahí más de una vez.\"",
    riesgoExploradoNarrative: "Andrés aclara, al preguntarle directamente, que no tiene un plan ni acceso a medios para hacerse daño, y que no ha tenido intentos previos. Dice que el pensamiento aparece principalmente de noche, cuando se siente más solo. Reconoce que un par de amigos cercanos han estado pendientes de él, aunque no les ha contado la intensidad real de lo que siente.",
    riesgoOmitidoNarrative: "La entrevista continúa. Andrés no vuelve a mencionar espontáneamente lo que dijo, y esa señal queda sin explorar por el momento."
  },
  {
    id: "consulta_familiar",
    tag: "Caso C",
    tituloCorto: "Consulta sugerida por la familia",
    descripcion: "Valentina, 22 años, asiste a la primera cita porque sus padres insistieron, tras notar que se ha aislado y ha dejado de salir con amigos en los últimos meses; ella se muestra reservada sobre si realmente quiere estar ahí.",
    nombre: "Valentina", edad: 22,

/* ============================================================
   CASOS EFECTIVOS (incorporados + personalizados por el docente)
   Los casos base viven en el código (CASES). El docente puede,
   desde Modo docente, agregar casos nuevos, editar los existentes
   u ocultarlos — esos cambios se guardan en Netlify Blobs a través
   de la función /cases y se combinan aquí con los casos base.
   ============================================================ */

let EFFECTIVE_CASES = CASES.slice();

async function refreshEffectiveCases(){
  let overrides = {};
  try{
    const res = await fetch("/.netlify/functions/cases");
    if(res.ok){
      const data = await res.json();
      (data.cases || []).forEach(c => { overrides[c.id] = c; });
    }
  } catch(e){ /* si falla, seguimos solo con los casos base */ }

  const merged = CASES
    .filter(c => !(overrides[c.id] && overrides[c.id].hidden))
    .map(c => (overrides[c.id] && !overrides[c.id].hidden) ? Object.assign({}, c, overrides[c.id]) : c);

  Object.keys(overrides).forEach(id => {
    const c = overrides[id];
    if(!c.hidden && !CASES.find(bc => bc.id === id)) merged.push(c);
  });

  EFFECTIVE_CASES = merged.length ? merged : CASES.slice();
  teacherState.caseOverrides = overrides;
  return EFFECTIVE_CASES;
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if(height >= width && height > maxDim){
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("No se pudo leer la imagen."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
    reader.readAsDataURL(file);
  });
}

function slugify(text){
  return (text || "caso")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 40) || "caso";
}

function pickCase(choiceId){
  const pool = EFFECTIVE_CASES.length ? EFFECTIVE_CASES : CASES;
  if(choiceId === "aleatorio"){

  }
  return pool.find(c => c.id === choiceId) || pool[0];
}

/* ============================================================
   MOTOR DE EVALUACIÓN DE RESPUESTAS ABIERTAS (API Claude)
   ============================================================ */

async function evaluateFreeResponse(sceneId, sceneDef, studentText){
  // El prompt del sistema y la llamada a la API de Anthropic ahora viven en
  // netlify/functions/evaluate.js, del lado del servidor, para no exponer
  // la clave de API en el navegador del estudiante.
  try{
    const response = await fetch("/.netlify/functions/evaluate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        studentText,
        maxPts: sceneDef.maxPts,
        evalContext: sceneDef.evalContext
      })
    });
    if(!response.ok) throw new Error(`Función de evaluación respondió ${response.status}`);
    const parsed = await response.json();
    if(parsed.error) throw new Error(parsed.error);
    let score = Math.max(0, Math.min(sceneDef.maxPts, Math.round(parsed.score)));
    return {
      score,
      feedback: parsed.feedback || "",
      strength: parsed.strength || "",
      error: parsed.error || ""
    };
  } catch(e){
    return heuristicEvaluate(sceneDef, studentText);
  }
}

function heuristicEvaluate(sceneDef, text){
  const t = (text || "").toLowerCase().trim();
  if(!t){
    return { score: 0, feedback: "No se registró una respuesta. (Evaluación estimada: no se pudo contactar al motor de evaluación.)", strength:"", error:"Respuesta vacía." };
  }
  const goodSignals = ["cuénteme más","cuenteme mas","cómo ha sido","como ha sido","qué más","que mas","entiendo","comprendo","es comprensible","desde cuándo","desde cuando","cómo se siente","como se siente","tu ritmo","su ritmo","cuando quieras","cuando guste","apoyo","red de apoyo","cómo lo ha vivido"];
  const badSignals = ["no se preocupe","no te preocupes","seguro se le va a pasar","seguro se le pasa","sí o no","si o no","cuénteme exactamente","cuenteme exactamente","le prometo que nada","te prometo que nada"];
  let score = Math.min(sceneDef.maxPts, Math.round(sceneDef.maxPts * 0.55));
  goodSignals.forEach(s => { if(t.includes(s)) score = Math.min(sceneDef.maxPts, score + 1); });
  badSignals.forEach(s => { if(t.includes(s)) score = Math.max(0, score - 2); });
  return {
    score,
    feedback: "Evaluación estimada localmente (no se pudo contactar al motor de evaluación en línea). Revisa esta respuesta con tu docente.",
    strength: "", error: ""
  };
}

        scores: state.scores,
        log: state.log,
        errors: state.errors,
        total: totalScore()
      })
    });
    if(!response.ok) throw new Error(`No se pudo guardar la sesión (${response.status})`);
  } catch(e){ /* almacenamiento no disponible; el reporte sigue visible en pantalla */ }
}

async function deleteSessionFromServer(key){
  try{
    const res = await fetch("/.netlify/functions/sessions", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key })
    });
    return res.ok;
  } catch(e){
    window.alert("No se pudo borrar la sesión: " + e.message);
    return false;
  }
}

async function loadSessions(){
  try{
    const response = await fetch("/.netlify/functions/sessions");
    if(!response.ok) throw new Error(`No se pudieron cargar las sesiones (${response.status})`);
    const data = await response.json();
    teacherState.sessions = data.sessions || [];
  } catch(e){
    teacherState.sessions = [];
  }
}

function totalScore(){
  return Object.values(state.scores).reduce((a,b) => a + b, 0);
}

function performanceLevel(total){
  if(total >= 90) return { label: "Excelente", cls: "level-excelente" };
  if(total >= 80) return { label: "Adecuado", cls: "level-adecuado" };
  if(total >= 70) return { label: "En desarrollo", cls: "level-desarrollo" };
  return { label: "Requiere fortalecimiento", cls: "level-fortalecimiento" };
}

const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  app.appendChild(renderHeader());
  if(activeTab === "teacher" && teacherUnlocked){
    app.appendChild(renderTeacherMode());
    return;
  }
  if(activeTab === "teacher" && !teacherUnlocked){
    activeTab = "sim";
  }
  if(!state || state.view === "intro"){
    app.appendChild(renderIntro());
  } else if(state.view === "sim"){
    app.appendChild(renderCaseBanner());
    app.appendChild(renderPhaseTrack());
    app.appendChild(renderScene());
  } else if(state.view === "report"){
    app.appendChild(renderCaseBanner());
    app.appendChild(renderReport());
  }
}

function renderPhaseTrack(){
  const scene = SCENES[state.sceneId];
  const phases = [
    { id: "mirar", label: "Encuadre" },
    { id: "escuchar", label: "Exploración" },
    { id: "conectar", label: "Cierre" }
  ];
  const currentIdx = phases.findIndex(p => p.id === scene.phase);
  const wrap = document.createElement("div");
  wrap.className = "phase-track";
  phases.forEach((p, i) => {
    const step = document.createElement("div");
    step.className = "phase-step " + (i < currentIdx ? "done" : i === currentIdx ? "current" : "");
    step.innerHTML = `<div class="phase-dot"></div><span>${p.label}</span>`;
    wrap.appendChild(step);
    if(i < phases.length - 1){
      const line = document.createElement("div");
      line.className = "phase-line";
      wrap.appendChild(line);
    }
  });
  return wrap;
}

function renderScene(){
  const scene = SCENES[state.sceneId];
  const panel = document.createElement("div");
  panel.className = "panel";

  let html = `<span class="scene-label">${scene.label}</span><p class="narrative">${scene.narrative}</p>`;
  if(scene.characterLine){
    html += `<div class="character-line">${scene.characterLine}</div>`;
  }
  panel.innerHTML = html;

  if(scene.type === "info"){
    const btnRow = document.createElement("div");
    btnRow.className = "submit-row";
    btnRow.innerHTML = `<button class="btn-primary">Continuar</button>`;
    btnRow.querySelector("button").addEventListener("click", () => advanceScene(scene.next));
    panel.appendChild(btnRow);
    return panel;
  }

  if(scene.type === "choice"){
    const optsWrap = document.createElement("div");
    optsWrap.className = "options";
    optsWrap.style.marginTop = "18px";
    scene.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-letter">${String.fromCharCode(97+i)})</span>${opt.text}`;
      btn.addEventListener("click", () => handleChoice(scene, opt, i));
      optsWrap.appendChild(btn);
    });
    panel.appendChild(optsWrap);
    return panel;
  }

  if(scene.type === "free"){
    const q = document.createElement("p");
    q.className = "prompt-q";
    q.textContent = scene.prompt;
    panel.appendChild(q);
    const ta = document.createElement("textarea");
    ta.className = "freeform";
    ta.placeholder = "Escribe tu respuesta con tus propias palabras...";
    panel.appendChild(ta);
    const row = document.createElement("div");
    row.className = "submit-row";
    const btn = document.createElement("button");
    btn.className = "btn-primary";
    btn.textContent = "Enviar respuesta";
    row.appendChild(btn);
    panel.appendChild(row);

    btn.addEventListener("click", async () => {
      const text = ta.value.trim();
      if(!text){ ta.focus(); return; }
      btn.disabled = true; btn.textContent = "Evaluando...";
      const loading = document.createElement("div");
      loading.className = "loading-line";
      loading.textContent = "Analizando la respuesta en el contexto clínico de la escena...";
      panel.appendChild(loading);
      const result = await evaluateFreeResponse(state.sceneId, scene, text);
      handleFreeResponse(scene, text, result);
    });
    return panel;
  }
}

function handleChoice(scene, opt, idx){
  state.scores[scene.category] = Math.max(0, state.scores[scene.category] + opt.pts);

  const sceneId = state.sceneId;
  const penaltyMap = ETHICS_PENALTIES[sceneId];
  if(penaltyMap && penaltyMap[idx]){
    state.scores.etica = Math.max(0, state.scores.etica - penaltyMap[idx]);
  }

  if(opt.error) state.errors.push({ scene: scene.label, text: opt.error });

  state.log.push({
    scene: scene.label, type: "opción elegida", text: opt.text,
    error: opt.error || null
  });

  const nextId = opt.next || scene.next;
  if(sceneId === "senal_riesgo"){
    state.riskHandled = (nextId === "riesgo_explorado");
  }
  advanceScene(nextId);
}

function handleFreeResponse(scene, text, result){
  state.scores[scene.category] = Math.max(0, state.scores[scene.category] + result.score);
  state.log.push({
    scene: scene.label, type: "respuesta escrita", text,
    feedback: result.feedback, strength: result.strength, error: result.error
  });
  if(result.error) state.errors.push({ scene: scene.label, text: result.error });
  advanceScene(scene.next);
}

function advanceScene(nextId){
  if(nextId === "END"){
    state.endTime = Date.now();
    state.view = "report";
    saveSession();
    render();
    return;
  }
  state.sceneId = nextId;
  render();
}

function renderReport(){
  const total = Math.round(totalScore());
  const level = performanceLevel(total);
  const wrap = document.createElement("div");
  wrap.className = "panel";

  const strengths = state.log.filter(l => l.strength).map(l => l.strength);
  const omitted = [];
  if(state.riskHandled === false) omitted.push("Indagación directa sobre riesgo de autolesión/suicidio (señal de alerta no explorada).");

  let html = `
    <div class="score-hero">
      <div class="score-circle"><span class="num">${total}</span><span class="den">/ 100</span></div>
      <div>
        <span class="level-tag ${level.cls}">${level.label}</span>
        <div style="font-family:var(--serif); font-size:19px; margin-top:4px;">Reporte de desempeño — ${escapeHtml(state.studentName)}</div>
        <div style="font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:2px;">Caso: ${escapeHtml(currentCase.tituloCorto)} · Tiempo utilizado: ${formatDuration(state.endTime - state.startTime)}</div>
      </div>
    </div>
    <div class="report-section"><h3>Puntaje por competencia</h3>
      ${Object.keys(MAX_SCORES).map(k => barRow(k)).join("")}
    </div>
  `;
  wrap.innerHTML = html;

  const strengthsSection = section("Fortalezas identificadas",
    strengths.length ? strengths.map(s => `<li class="tag-strength">${escapeHtml(s)}</li>`).join("")
      : `<li>Se identificarán fortalezas específicas a medida que se registren respuestas escritas de calidad.</li>`);
  wrap.appendChild(strengthsSection);

  const errorsSection = section("Errores detectados",
    state.errors.length ? state.errors.map(e => `<li class="tag-error"><strong>${escapeHtml(e.scene)}:</strong> ${escapeHtml(e.text)}</li>`).join("")
      : `<li>No se registraron errores significativos durante la simulación.</li>`);
  wrap.appendChild(errorsSection);

  const riskSection = section("Decisiones de riesgo",
    state.riskHandled === false
      ? `<li class="tag-risk">Se omitió explorar una señal directa de posible riesgo de autolesión/suicidio expresada por el/la consultante.</li>`
      : state.riskHandled === true
        ? `<li>La señal de riesgo presentada fue explorada de forma directa y apropiada.</li>`
        : `<li>No se presentaron decisiones de alto riesgo adicionales en esta simulación.</li>`);
  wrap.appendChild(riskSection);

  const omittedSection = section("Información que se omitió obtener",
    omitted.length ? omitted.map(o => `<li>${escapeHtml(o)}</li>`).join("")
      : `<li>No se identificaron omisiones relevantes de información en esta simulación.</li>`);
  wrap.appendChild(omittedSection);

  const recSection = section("Qué habría sido recomendable hacer",
    buildRecommendations().map(r => `<li>${escapeHtml(r)}</li>`).join(""));
  wrap.appendChild(recSection);

  const feedbackSection = section("Retroalimentación específica",
    state.log.filter(l => l.feedback).map(l => `<li><strong>${escapeHtml(l.scene)}:</strong> ${escapeHtml(l.feedback)}</li>`).join("")
      || "<li>Sin observaciones adicionales.</li>");
  wrap.appendChild(feedbackSection);

  const closing = document.createElement("div");
  closing.className = "disclaimer";
  closing.style.marginTop = "24px";
  closing.textContent = "Este resultado tiene fines formativos. Revisa este reporte junto a tu docente para profundizar en tu proceso de aprendizaje. El simulador no reemplaza la práctica clínica supervisada.";
  wrap.appendChild(closing);

  const restartRow = document.createElement("div");
  restartRow.style.marginTop = "20px";
  const restartBtn = document.createElement("button");
  restartBtn.className = "btn-secondary";
  restartBtn.textContent = "Reiniciar con un nuevo caso";
  restartBtn.addEventListener("click", () => { state = freshState(); currentCase = null; SCENES = null; render(); });
  restartRow.appendChild(restartBtn);
  wrap.appendChild(restartRow);

  return wrap;
}

function barRow(key){
  const val = Math.round(state.scores[key] * 10) / 10;
  const max = MAX_SCORES[key];
  const pct = Math.max(0, Math.min(100, (val / max) * 100));
  return `<div class="bar-row">
    <div class="bar-label">${CATEGORY_LABELS[key]}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
    <div class="bar-val">${val}/${max}</div>
  </div>`;
}

function section(title, innerHtml){
  const s = document.createElement("div");
  s.className = "report-section";
  s.innerHTML = `<h3>${title}</h3><ul>${innerHtml}</ul>`;
  return s;
}

function buildRecommendations(){
  const recs = [];
  if(state.riskHandled === false) recs.push("Ante cualquier expresión de desesperanza o ideas de \"no querer seguir\", preguntar siempre de forma directa y calmada por pensamientos de autolesión o suicidio.");
  if(state.scores.comunicacion < 14) recs.push("Reforzar la validación emocional y evitar frases como \"cálmate\" o preguntas que presionen el relato del evento.");
  if(state.scores.necesidades < 14) recs.push("Ampliar la exploración de necesidades inmediatas: seguridad física, red de apoyo y estado emocional, antes de avanzar a la intervención.");
  if(state.scores.etica < 4) recs.push("Revisar los límites de la confidencialidad cuando existe riesgo para la vida, y evitar cerrar diagnósticos o comprometerse con disponibilidad ilimitada en una primera entrevista.");
  if(state.scores.recursos < 7) recs.push("Priorizar la activación de la propia red de apoyo de la persona en lugar de asumir la responsabilidad de resolver todo.");
  if(state.scores.derivacion < 7) recs.push("Fundamentar con mayor claridad cuándo y por qué corresponde derivar a apoyo profesional.");
  if(!recs.length) recs.push("Continúa consolidando el manejo integrado del encuadre, la exploración clínica y el cierre en distintos tipos de primera entrevista.");
  return recs;
}

function formatDuration(ms){
  const totalSec = Math.max(0, Math.round(ms/1000));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m} min ${s.toString().padStart(2,"0")} s`;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

function renderCaseEditor(){

      <div style="display:flex; gap:12px; align-items:center;">

      if(!window.confirm(msg)) return;
      const ok = isBuiltIn ? await saveCaseToServer(Object.assign({}, c, { hidden: true })) : await deleteCaseFromServer(c.id);

  return frag;

function buildCaseForm(editingId){
  const isNew = editingId === "NEW";
  const existing = isNew ? null : EFFECTIVE_CASES.find(c => c.id === editingId);
  const data = existing ? Object.assign({}, existing) : {
    tag: "", tituloCorto: "", descripcion: "", nombre: "", edad: "",
    persona: "la persona", personaCap: "La persona", pron: "ella",
    acompanado: "acompañada", herido: "herida",
    llegada: "", aperturaLine: "", estadoInicial: "",
    necesidadesNarrative: "", senalRiesgoLine: "", riesgoExploradoNarrative: "", riesgoOmitidoNarrative: ""
  };

  const form = document.createElement("div");
  form.className = "case-form";
  form.innerHTML = `<h3 style="font-family:var(--sans); font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin:0 0 12px;">${isNew ? "Nuevo caso" : "Editar caso"}</h3>
    <div class="full" style="margin-bottom:16px;">
      <label>Imagen del caso (opcional)</label>
      <div class="image-upload-row">
        <div class="image-preview" id="imagePreview">${data.imageDataUrl ? `<img src="${data.imageDataUrl}">` : "Sin imagen"}</div>
        <div class="image-upload-controls">
          <input type="file" accept="image/*" id="imageFileInput">
          <button type="button" class="btn-mini danger" id="removeImageBtn" style="${data.imageDataUrl ? "" : "display:none;"}">Quitar imagen</button>
        </div>
      </div>
    </div>
    <div class="form-grid">
      ${CASE_FORM_FIELDS.map(f => `
        <div class="${f.full ? "full" : ""}">
          <label>${f.label}</label>
          ${f.type === "textarea"
            ? `<textarea data-field="${f.key}">${escapeHtml(data[f.key] || "")}</textarea>`
            : `<input type="text" data-field="${f.key}" value="${escapeHtml(String(data[f.key] || ""))}">`}
        </div>
      `).join("")}
    </div>
    <div class="case-form-actions">
      <button class="btn-primary" id="saveCaseBtn">Guardar caso</button>
      <button class="btn-secondary" id="cancelCaseBtn">Cancelar</button>
    </div>
  `;

  let currentImageDataUrl = data.imageDataUrl || null;
  const imagePreview = form.querySelector("#imagePreview");
  const removeImageBtn = form.querySelector("#removeImageBtn");
  form.querySelector("#imageFileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){ window.alert("Selecciona un archivo de imagen."); return; }
    try{
      currentImageDataUrl = await resizeImageFile(file, 640, 0.78);
      imagePreview.innerHTML = `<img src="${currentImageDataUrl}">`;
      removeImageBtn.style.display = "";
    } catch(err){
      window.alert("No se pudo procesar la imagen: " + err.message);
    }
  });
  removeImageBtn.addEventListener("click", () => {
    currentImageDataUrl = null;
    imagePreview.textContent = "Sin imagen";
    removeImageBtn.style.display = "none";
  });

  form.querySelector("#cancelCaseBtn").addEventListener("click", () => {
    teacherState.editingCaseId = null;
    render();
  });

  form.querySelector("#saveCaseBtn").addEventListener("click", async () => {
    const values = {};
    CASE_FORM_FIELDS.forEach(f => {
      values[f.key] = form.querySelector(`[data-field="${f.key}"]`).value.trim();
    });
    if(!values.tituloCorto || !values.nombre || !values.edad){
      window.alert("Completa al menos: título corto, nombre y edad.");
      return;
    }
    values.edad = Number(values.edad) || values.edad;
    values.id = isNew ? `custom_${slugify(values.tituloCorto)}_${Date.now().toString(36)}` : editingId;
    values.imageDataUrl = currentImageDataUrl;

    const btn = form.querySelector("#saveCaseBtn");
    btn.disabled = true; btn.textContent = "Guardando...";
    const ok = await saveCaseToServer(values);
    btn.disabled = false; btn.textContent = "Guardar caso";
    if(ok){
      teacherState.editingCaseId = null;
      await refreshEffectiveCases();
      render();
    }
  });

  return form;
}

function renderSessionsList(){
  const list = document.createElement("div");
  list.style.marginTop = "18px";

  if(!teacherState.sessions.length){
    const empty = document.createElement("div");
    empty.className = "empty-note";
    empty.textContent = "Aún no hay simulaciones registradas, o no fue posible acceder al almacenamiento.";
    list.appendChild(empty);
  } else {
    teacherState.sessions.forEach((s, idx) => {
      const row = document.createElement("div");
      row.className = "session-row";
      const level = performanceLevel(s.total);
      row.innerHTML = `
        <div class="session-row-head">
          <div>
            <span class="name">${escapeHtml(s.studentName)}</span>
            <span class="meta">${escapeHtml(s.caseTag || "")} ${escapeHtml(s.caseTitle || "")} · ${new Date(s.startTime).toLocaleString("es-CO")} · ${Math.round(s.total)}/100 · ${level.label}</span>
          </div>
          <button class="btn-mini danger" data-act="delete-session" type="button">Borrar</button>
        </div>
        <div class="session-detail" id="detail-${idx}"></div>
      `;
      row.querySelector('[data-act="delete-session"]').addEventListener("click", async (ev) => {
        ev.stopPropagation();
        if(!window.confirm(`¿Borrar definitivamente la sesión de ${s.studentName}? Esta acción no se puede deshacer.`)) return;
        const ok = await deleteSessionFromServer(s.key);
        if(ok){ await loadSessions(); render(); }
      });
      row.addEventListener("click", () => {
        const detail = row.querySelector(".session-detail");
        const isOpen = detail.classList.contains("open");
        if(!isOpen && !detail.dataset.built){
          detail.appendChild(buildTeacherDetail(s));
          detail.dataset.built = "1";
        }
        detail.classList.toggle("open");
      });
      list.appendChild(row);
    });
  }

  return list;
}

function buildTeacherDetail(s){
  const frag = document.createElement("div");
  const dur = s.endTime ? formatDuration(s.endTime - s.startTime) : "—";

  let html = `<div style="font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-bottom:12px;">Tiempo utilizado: ${dur}</div>`;
  html += `<div class="report-section" style="margin-top:0;"><h3 style="margin-top:0;">Puntaje por competencia</h3>`;
  Object.keys(MAX_SCORES).forEach(k => {
    const val = Math.round((s.scores[k]||0) * 10)/10;
    html += `<div class="bar-row"><div class="bar-label">${CATEGORY_LABELS[k]}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(val/MAX_SCORES[k])*100)}%;"></div></div><div class="bar-val">${val}/${MAX_SCORES[k]}</div></div>`;
  });
  html += `</div>`;

  html += `<h3 style="font-family:var(--sans); font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin:20px 0 10px;">Errores frecuentes</h3>`;
  html += s.errors && s.errors.length
    ? `<ul>${s.errors.map(e => `<li class="tag-error"><strong>${escapeHtml(e.scene)}:</strong> ${escapeHtml(e.text)}</li>`).join("")}</ul>`
    : `<p style="font-size:13px; color:var(--ink-soft);">Sin errores registrados.</p>`;

  html += `<h3 style="font-family:var(--sans); font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin:20px 0 10px;">Decisiones y respuestas escritas</h3>`;
  frag.innerHTML = html;

  const logWrap = document.createElement("div");
  (s.log || []).forEach(l => {
    const entry = document.createElement("div");
    entry.className = "log-entry";
    entry.innerHTML = `<div class="scene-tag">${escapeHtml(l.scene)} · ${escapeHtml(l.type)}</div><div>${escapeHtml(l.text)}</div>${l.feedback ? `<div style="color:var(--teal-deep); margin-top:4px;">↳ ${escapeHtml(l.feedback)}</div>` : ""}`;
    logWrap.appendChild(entry);
  });
  frag.appendChild(logWrap);
  return frag;
}

/* ============================================================
   INICIO
   ============================================================ */

render();
refreshEffectiveCases().then(() => {
  if(!state || state.view === "intro") render();
});

})();
</script>
</body>
</html>
